name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Defang
        run: |
          curl -fsSL https://s.defang.io/install | sh
          ~/.defang/bin/defang compose up --project chatgpt --provider gcp
        env:
          DEFANG_ACCESS_TOKEN: ${{ secrets.DEFANG_ACCESS_TOKEN }}
