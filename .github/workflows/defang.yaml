name: defang
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Defang
        uses: defang-io/defang-github-action@v1
        with:
          command: "deploy --project chatgpt"
