name: defang
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Defang CLI
        run: |
          curl -fsSL https://s.defang.io/install | sh
          echo "$HOME/.defang/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Deploy to GCP
        run: defang compose up --project chatgpt --provider gcp
