name: defang.yaml
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Defang
        uses: DefangLabs/defang-github-action@v1
        with:
          provider: aws
          # or gcp if you use GCP
          access-token: ${{ secrets.DEFANG_ACCESS_TOKEN }}
          command: "compose up --mode production"
